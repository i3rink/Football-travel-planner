<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Travel Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #f5c800;
    --yellow-dark: #c9a200;
    --yellow-light: #fffbe6;
    --black: #111110;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --red: #b91c1c;
    --red-bg: #fee2e2;
    --bg: #f5f5f2;
    --card: #ffffff;
    --text: #111110;
    --muted: #6b6b67;
    --border: #e0e0db;
    --radius: 10px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 3rem;
  }

  header {
    background: var(--black);
    color: var(--yellow);
    padding: 1.5rem 1.25rem 1.25rem;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 140px; height: 140px;
    border: 20px solid rgba(245,200,0,0.08);
    border-radius: 50%;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40%;
    width: 100px; height: 100px;
    border: 15px solid rgba(245,200,0,0.05);
    border-radius: 50%;
  }

  .header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(245,200,0,0.6);
    margin-bottom: 4px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--yellow);
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-top: 1rem;
  }

  .card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .field { margin-bottom: 0.85rem; }
  .field:last-child { margin-bottom: 0; }
